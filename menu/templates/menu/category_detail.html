{% extends "base.html" %}
{% block content %}
<h2 class="text-center mb-4">{{ category.name }}</h2>

<div class="row">
  {% for item in items %}
    <div class="col-md-3 mb-4">
      <div class="card h-100 shadow-sm text-center">
        {% if item.image %}
          <img src="{{ item.image.url }}" class="card-img-top item-img" alt="{{ item.name }}">
        {% endif %}
        <div class="card-body d-flex flex-column justify-content-between">
          <div>
            <h5 class="card-title">{{ item.name }}</h5>
            <p class="text-muted">€{{ item.price }}</p>
          </div>
          <form method="post" action="{% url 'orders:add_to_cart' item.id %}">
            {% csrf_token %}
            <button class="btn btn-success btn-sm mt-auto">Add to Cart</button>
          </form>
        </div>
      </div>
    </div>
  {% empty %}
    <p class="text-center">No items available.</p>
  {% endfor %}
</div>

<style>
  .item-img {
    height: 180px;
    object-fit: cover;
    border-bottom: 2px solid #f8f9fa;
  }
</style>
{% endblock %}
