{% extends "base.html" %}
{% block content %}
<div class="container mt-5" style="max-width: 400px;">
  <div class="card shadow-sm">
    <div class="card-body p-4 text-center">
        
      <h3 class="mb-3">Two-Step Verification</h3>
      
      <p class="text-muted mb-4">
        We just sent a 6-digit code to <strong>{{ email }}</strong>. <br>
        Please enter it below to securely log in.
      </p>

      <form method="POST" action="{% url 'users:verify_otp' %}">
        {% csrf_token %}
        
        <div class="mb-3">
            <input type="text" name="otp" id="otp" class="form-control form-control-lg text-center" 
                   placeholder="123456" maxlength="6" autocomplete="one-time-code" required autofocus 
                   style="letter-spacing: 0.5em; font-size: 1.5rem;">
        </div>

        <button type="submit" class="btn btn-dark w-100 btn-lg mt-2">Verify & Login</button>
      </form>

      <div class="mt-4">
        <a href="{% url 'users:login' %}" class="text-decoration-none text-secondary">
          <small>Cancel and go back to login</small>
        </a>
      </div>
      
    </div>
  </div>
</div>
{% endblock %}
