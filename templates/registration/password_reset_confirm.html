{% extends "base.html" %}
{% block content %}
<div class="container mt-4" style="max-width: 500px;">
  <h2 class="text-center mb-3">Set New Password</h2>
  {% if validlink %}
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-success w-100">Update Password</button>
    </form>
  {% else %}
    <p class="text-danger text-center">This password reset link is invalid or has expired.</p>
  {% endif %}
</div>
{% endblock %}
