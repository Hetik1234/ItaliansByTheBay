<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Order Status Update</title>
  </head>
  <body style="font-family: Arial, sans-serif; line-height: 1.6;">
    <p>Hi {{ username }},</p>
    <p>Your order #{{ order_id }} status has been updated to: <strong>{{ status }}</strong>.</p>
    <p>Thank you for ordering with {{ site_name }}!</p>
  </body>
</html>
